<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>RTM 打点录入</title>
<style>
  :root{
    --blue:#3370ff; --blue-d:#245bdb; --bg:#f5f6f7; --card:#fff;
    --text:#1f2329; --sub:#8f959e; --line:#e5e6eb; --ok:#34c724; --err:#f54a45; --warn:#ff8800;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    display:flex;flex-direction:column;
    padding-bottom:calc(92px + env(safe-area-inset-bottom));
    -webkit-user-select:none;user-select:none;
  }

  /* ── 顶部：记录人 + 当前车辆 ─────────────
     两行而非一行：车辆编号较长（LC6-ECA2902），与姓名挤一行会被省略号截断，
     而车辆是打点归属的关键信息，截断后无法确认选对了没有。 */
  header{
    background:var(--card);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:10;
  }
  header .hrow{display:flex;align-items:center;gap:10px;padding:10px 16px}
  header .hrow + .hrow{border-top:1px solid var(--line)}
  header .label{font-size:12px;color:var(--sub);flex:none;width:38px}
  header .name{font-size:15px;font-weight:600;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .name.ph{color:var(--sub);font-weight:400;font-size:14px}
  header .edit{
    flex:none;border:1px solid var(--line);background:#fff;color:var(--blue);
    border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;
  }
  header .edit:active{background:#f0f1f2}

  /* ── 列表 ──────────────────────────────── */
  main{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:48px 20px;line-height:1.8}

  .rec{background:var(--card);border-radius:12px;overflow:hidden}
  .rec.saving{opacity:.6;pointer-events:none}
  .rec.failed{box-shadow:inset 0 0 0 1px var(--err)}

  .rec-head{
    display:flex;align-items:center;gap:10px;
    padding:14px 16px;cursor:pointer;
  }
  .rec-head:active{background:#fafafa}
  .rec-head .time{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;flex:1}
  .rec-head .tags{display:flex;gap:6px;align-items:center;flex:none}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#f0f1f2;color:var(--sub)}
  .tag.draft{background:#fff3e0;color:var(--warn)}
  .tag.failed{background:#ffeceb;color:var(--err)}
  .tag.saved{background:#e8f7e6;color:#2ba81c}
  /* 车辆编号较长（MY26E0YL3POC-000611A 有 21 字符），限宽 + 省略号避免挤掉时间 */
  .tag.veh{background:#eaf1ff;color:var(--blue);max-width:118px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rec-head .chev{
    flex:none;color:var(--sub);font-size:12px;transition:transform .18s;
  }
  .rec.open .rec-head .chev{transform:rotate(90deg)}

  .rec-body{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
  .rec.open .rec-body{display:block}

  .field{margin-top:14px}
  .field > label{display:block;font-size:12px;color:var(--sub);margin-bottom:7px}

  /* 时间行 */
  .time-row{display:flex;align-items:center;gap:8px}
  .time-row .val{font-size:15px;font-variant-numeric:tabular-nums;flex:1}
  .mini{
    border:1px solid var(--line);background:#fff;color:var(--text);
    border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;flex:none;
  }
  .mini:active{background:#f0f1f2}

  /* 录音 */
  .rec-wrap{display:flex;align-items:center;gap:12px}
  .rec-btn{
    width:76px;height:76px;border-radius:50%;border:none;flex:none;
    background:var(--blue);color:#fff;font-size:12px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    cursor:pointer;transition:transform .12s,background .12s;
  }
  .rec-btn .ico{font-size:20px;line-height:1}
  .rec-btn:active{transform:scale(.95)}
  .rec-btn.on{background:var(--err);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
  .rec-side{flex:1;min-width:0}
  .rec-side audio{width:100%;height:38px}
  .rec-hint{font-size:12px;color:var(--sub);margin-top:4px}
  .rec-hint.err{color:var(--err)}

  textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font:inherit;font-size:15px;resize:none;
    min-height:76px;background:#fff;color:var(--text);
    -webkit-user-select:text;user-select:text;
  }
  textarea:focus{outline:none;border-color:var(--blue)}
  .counter{text-align:right;font-size:11px;color:var(--sub);margin-top:4px}

  .actions{display:flex;gap:10px;margin-top:16px}
  .btn{
    flex:1;border:none;border-radius:10px;padding:13px;font-size:15px;
    font-weight:600;cursor:pointer;
  }
  .btn.primary{background:var(--blue);color:#fff}
  .btn.primary:active{background:var(--blue-d)}
  .btn.ghost{background:#f0f1f2;color:var(--text);flex:none;padding:13px 18px}
  .btn.danger{background:#ffeceb;color:var(--err);flex:none;padding:13px 18px}
  .btn:disabled{opacity:.5;pointer-events:none}

  /* ── 底部打点按钮 ──────────────────────── */
  footer{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(245,246,247,.96) 60%,rgba(245,246,247,0));
  }
  #punch{
    width:100%;border:none;border-radius:14px;
    background:var(--blue);color:#fff;
    padding:20px;font-size:20px;font-weight:700;letter-spacing:2px;
    box-shadow:0 6px 20px rgba(51,112,255,.35);cursor:pointer;
    transition:transform .12s,background .12s;
  }
  #punch:active{transform:scale(.985);background:var(--blue-d)}

  /* ── 记录人设置弹层 ────────────────────── */
  .mask{
    position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .mask.show{display:flex}
  .dialog{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:340px}
  .dialog h2{margin:0 0 6px;font-size:17px}
  .dialog p{margin:0 0 14px;font-size:13px;color:var(--sub);line-height:1.6}
  .dialog input{
    width:100%;border:1px solid var(--line);border-radius:10px;
    padding:12px;font:inherit;font-size:16px;
    -webkit-user-select:text;user-select:text;
  }
  .dialog input:focus{outline:none;border-color:var(--blue)}
  .dialog .actions{margin-top:16px}

  /* ── 车辆选择弹层 ──────────────────────── */
  .dialog.wide{max-width:420px;max-height:82vh;display:flex;flex-direction:column}
  .veh-list{
    flex:1;overflow-y:auto;margin-top:12px;min-height:120px;
    -webkit-overflow-scrolling:touch;
  }
  .veh-group{
    font-size:11px;color:var(--sub);font-weight:600;
    padding:10px 12px 5px;position:sticky;top:0;background:#fff;
  }
  .veh-item{
    padding:11px 12px;border-radius:9px;cursor:pointer;
    display:flex;align-items:center;gap:9px;
  }
  .veh-item:active{background:#f0f1f2}
  .veh-item.on{background:#eaf1ff}
  .veh-item .p{font-size:15px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}
  .veh-item .meta{
    font-size:11px;color:var(--sub);flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .veh-item .tick{flex:none;color:var(--blue);font-size:14px;font-weight:700}
  .veh-none{text-align:center;color:var(--sub);font-size:13px;padding:28px 12px}

  /* ── Toast ─────────────────────────────── */
  #toast{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    background:rgba(0,0,0,.82);color:#fff;padding:13px 22px;border-radius:10px;
    font-size:14px;max-width:80%;text-align:center;line-height:1.6;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;
  }
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <span class="label">记录人</span>
    <span class="name" id="who">—</span>
    <button class="edit" id="whoEdit" type="button">修改</button>
  </div>
  <div class="hrow">
    <span class="label">车辆</span>
    <span class="name ph" id="veh">未选择</span>
    <button class="edit" id="vehEdit" type="button">选择</button>
  </div>
</header>

<main id="list"></main>

<footer>
  <button id="punch" type="button">打 点</button>
</footer>

<div class="mask" id="whoMask">
  <div class="dialog">
    <h2>确认记录人</h2>
    <p>打点记录会带上这个名字。填一次即记住，之后可随时点顶部「修改」。</p>
    <input id="whoInput" type="text" placeholder="请输入你的姓名" autocomplete="off" maxlength="20">
    <div class="actions">
      <button class="btn primary" id="whoSave" type="button">确认</button>
    </div>
  </div>
</div>

<!-- 车辆选择：整场测试通常固定一辆主车，故选一次即记住；
     多车场景（主车 + 目标车）可在每条打点里单独改 -->
<div class="mask" id="vehMask">
  <div class="dialog wide">
    <h2>选择车辆</h2>
    <p>选一次即记住，之后每次打点自动带上。单条打点仍可单独修改。</p>
    <input id="vehSearch" type="text" placeholder="搜索编号 / 车型 / 城市" autocomplete="off">
    <div class="veh-list" id="vehList"></div>
    <div class="actions">
      <button class="btn ghost" id="vehCancel" type="button">取消</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════════════ */
const CONFIG = {
  /* ⚠️ Webhook 内置（应业务要求，免去用户配置）。
     风险：本页托管于公开的 GitHub Pages，任何人查看源码即可获得该地址，
          进而向群里发送任意消息，而 RTM 会将其作为打点数据入库。
     一旦发现滥用：在飞书群「设置 → 群机器人 → 自定义机器人」重置 Webhook，
     并把新地址替换到此处、重新发布即可。 */

  MAX_RECORD_MS: 60000,      // 单段录音上限（60s，与飞书 ASR 上限对齐）
  CHUNK_SIZE: 12000,         // base64 分片大小（飞书单条 body 上限 20KB）
  CHUNK_GAP_MS: 260,         // 分片间隔，避开 webhook 5 次/秒限速
  TAG: '[RTM-CP]',           // RTM 侧据此识别本页面的消息

  /* ── 车辆清单 ────────────────────────────────────────────────
     来源：与 index.html 同目录的 vehicles.json（GitHub Pages 同源，
           既不触发 CORS，也不消耗 GitHub API 的匿名限额）。
     RTM 侧定期用 PAT 重新生成该文件 → Pages 自动发布 → 页面下次打开即拿到新清单。
     下面的 VEHICLES_FALLBACK 是**兜底副本**：JSON 拉不到时（弱网、文件尚未发布）
     仍能选车。由 backend/scripts/export-vehicles.ts 生成，勿手改。 */
  VEHICLES_URL: './vehicles.json',
  VEHICLES_FALLBACK: `CSUVL2-X25UVV086|CSUVL2|DAJIN_SHAN|上海
CSUVL3-X26UVV204|CSUVL3|DAJIN_SHAN|上海

MY25E02-402287|E02 8620|WUHUA_SHAN|芜湖
MY25E02-402295|E02 8620|WUHUA_SHAN|芜湖
MY25E02ORINY-391343|E02 ORINY|WUHUA_SHAN|苏州
MY26E01BMC-194055|E01 ORINY|WUHUA_SHAN|苏州
MY26E0YL3POC-000611A|MY26E0YL3|WUHUA_SHAN|芜湖
MY26E0YL3POC-000623A|MY26E0YL3|WUHUA_SHAN|芜湖
Buick-EC68721|友商|YOUSHANG|苏州
Buick-EC69020|友商|YOUSHANG|苏州
NA6-B98910|友商|YOUSHANG|苏州
Tesla V14|TESLA|YOUSHANG|苏州`,
};

const K_REPORTER = 'rtm_cp_reporter';
const K_RECORDS  = 'rtm_cp_records';
const K_VEHICLE  = 'rtm_cp_vehicle';
const IDB_NAME   = 'rtm_cp_audio';

const $ = (s) => document.querySelector(s);

/* ══ 状态 ══════════════════════════════════════════════════════
   record = {
     id     : batchId（H5 生成）
     t      : 'YYYY-MM-DD HH:mm:ss'  打点时间
     c      : 文字评论
     v      : 车辆编号（创建时继承顶部「当前车辆」，可在卡片里单独改）
     n      : 0/1 是否有音频（音频 Blob 存 IndexedDB，key = id）
     st     : 'draft' | 'saving' | 'saved' | 'failed'
     sent   : 是否已成功发送过（决定「保存」是首发还是补发修改）
   }
   ══════════════════════════════════════════════════════════════ */
let reporter = localStorage.getItem(K_REPORTER) || '';
let records  = loadRecords();          // 倒序：最新在前
let openId   = null;                   // 当前展开的记录 id
let offsetMin = 0;                     // 打点时间微调（分钟）

let vehicles   = [];                   // 车辆清单 [{plate,type,project,city}]
let curVehicle = localStorage.getItem(K_VEHICLE) || '';   // 顶部「当前车辆」
/** 车辆选择器正在为谁服务：null = 顶部当前车辆；否则 = 某条记录的 id */
let vehTarget  = null;

function loadRecords() {
  try {
    const a = JSON.parse(localStorage.getItem(K_RECORDS) || '[]');
    return Array.isArray(a) ? a : [];
  } catch { return []; }
}
function saveRecords() {
  try { localStorage.setItem(K_RECORDS, JSON.stringify(records)); }
  catch (e) { toast('本地存储写入失败，记录可能丢失'); }
}

/* ══ Toast ════════════════════════════════════════════════════ */
function toast(msg, ms) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), ms || 2200);
}

/* ══ 工具 ═════════════════════════════════════════════════════ */
const pad = (n) => String(n).padStart(2, '0');

/** 当前打点时间（含微调），格式 YYYY-MM-DD HH:mm:ss */
function nowStamp() {
  const d = new Date(Date.now() + offsetMin * 60000);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
         `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
/** 列表里只显示时分秒 */
const hhmmss = (stamp) => (stamp || '').slice(11);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

/* ══ 车辆清单 ══════════════════════════════════════════════════
   优先从同源的 vehicles.json 拉取（RTM 侧定期重新生成并提交到 Pages 仓库），
   失败则用页面内置的兜底副本 —— 弱网、文件尚未发布时仍能选车，页面永远可用。
   ══════════════════════════════════════════════════════════════ */
function parseVehicles(raw) {
  return raw.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {
    const [plate, type, project, city] = l.split('|');
    return { plate, type: type || '', project: project || '', city: city || '' };
  });
}

async function loadVehicles() {
  // 兜底先就位：即使 fetch 一直不返回，选车功能也是可用的
  vehicles = parseVehicles(CONFIG.VEHICLES_FALLBACK);
  try {
    // ⚠️ 加时间戳绕过 GitHub Pages 的 CDN 缓存，否则车辆变更后长时间拿到旧清单
    const resp = await fetch(`${CONFIG.VEHICLES_URL}?_=${Date.now()}`, { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    if (Array.isArray(data && data.vehicles) && data.vehicles.length) {
      vehicles = data.vehicles;
      console.log(`[车辆清单] 已加载 ${vehicles.length} 辆（更新时间 ${data.updatedAt || '未知'}）`);
    }
  } catch (e) {
    console.warn('[车辆清单] 拉取失败，使用内置兜底副本：', e.message);
  }
  renderVehLabel();
}

/** 顶部「车辆」标签 */
function renderVehLabel() {
  const el = $('#veh');
  el.textContent = curVehicle || '未选择';
  el.classList.toggle('ph', !curVehicle);
}

/** 打开车辆选择器；targetId 为空表示在选顶部「当前车辆」 */
function openVehDialog(targetId) {
  vehTarget = targetId || null;
  $('#vehSearch').value = '';
  renderVehList('');
  $('#vehMask').classList.add('show');
}

function renderVehList(kw) {
  const box = $('#vehList');
  box.textContent = '';
  const q = (kw || '').trim().toLowerCase();
  const hit = vehicles.filter((v) =>
    !q || `${v.plate} ${v.type} ${v.project} ${v.city}`.toLowerCase().includes(q));

  if (!hit.length) {
    const d = document.createElement('div');
    d.className = 'veh-none';
    d.textContent = vehicles.length ? '没有匹配的车辆' : '车辆清单加载中…';
    box.appendChild(d);
    return;
  }

  const target = vehTarget ? records.find((r) => r.id === vehTarget) : null;
  const picked = target ? (target.v || '') : curVehicle;

  // 按项目分组：57 辆车平铺太长，现场也是按项目找车
  let lastProject = null;
  hit.forEach((v) => {
    if (v.project !== lastProject) {
      lastProject = v.project;
      const g = document.createElement('div');
      g.className = 'veh-group';
      g.textContent = v.project || '（未分组）';
      box.appendChild(g);
    }
    const item = document.createElement('div');
    item.className = 'veh-item' + (v.plate === picked ? ' on' : '');
    const p = document.createElement('span');
    p.className = 'p';
    p.textContent = v.plate;
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = [v.type, v.city].filter(Boolean).join(' · ');
    const tick = document.createElement('span');
    tick.className = 'tick';
    tick.textContent = v.plate === picked ? '✓' : '';
    item.appendChild(p);
    item.appendChild(meta);
    item.appendChild(tick);
    item.addEventListener('click', () => onVehPick(v.plate));
    box.appendChild(item);
  });
}

function onVehPick(plate) {
  if (vehTarget) {
    const r = records.find((x) => x.id === vehTarget);   // 单条记录改车
    if (r) { r.v = plate; saveRecords(); }
  } else {                                              // 顶部当前车辆
    curVehicle = plate;
    localStorage.setItem(K_VEHICLE, plate);
    renderVehLabel();
  }
  $('#vehMask').classList.remove('show');
  vehTarget = null;
  render();
}

/* ══ IndexedDB：音频 Blob 持久化 ═══════════════════════════════
   localStorage 存不了 Blob（只有字符串），所以音频单独放 IndexedDB。
   这样刷新页面后，已保存的记录仍能播放、仍能改评论。
   ══════════════════════════════════════════════════════════════ */
function idb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains('blobs')) req.result.createObjectStore('blobs');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(key, blob) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('blobs', 'readwrite');
    tx.objectStore('blobs').put(blob, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('blobs', 'readonly');
    const r = tx.objectStore('blobs').get(key);
    r.onsuccess = () => resolve(r.result || null);
    r.onerror = () => reject(r.error);
  });
}
async function idbDel(key) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('blobs', 'readwrite');
    tx.objectStore('blobs').delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ══ 录音 ═════════════════════════════════════════════════════
   ⚠️ iOS Safari 不支持 webm，会落到 audio/mp4 —— 两条路径 RTM 侧
      都已验证（ffmpeg 靠魔数识别容器，与扩展名无关）。
   ══════════════════════════════════════════════════════════════ */
let rec = null;            // { id, recorder, chunks, timer, startedAt }
let curBlobUrl = null;     // 当前展开的播放地址，切换时需 revoke
let renderGen = 0;         // 渲染代次：音频 Blob 是异步取的，用它判断回调是否已过期

function pickMime() {
  const cands = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  for (const m of cands) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}

async function startRec(id) {
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    toast('当前浏览器不支持录音，请用系统浏览器打开');
    return;
  }
  if (rec) { toast('正在录音中'); return; }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (e) {
    // 区分「用户拒绝」与「环境不支持」——飞书内置浏览器常是后者
    toast('无法访问麦克风。若在飞书内打开，请改用手机浏览器');
    return;
  }

  const mime = pickMime();
  const opts = { audioBitsPerSecond: 16000 };
  if (mime) opts.mimeType = mime;

  let recorder;
  try { recorder = new MediaRecorder(stream, opts); }
  catch { recorder = new MediaRecorder(stream); }

  rec = { id, recorder, chunks: [], timer: null, stream };

  recorder.ondataavailable = (e) => { if (e.data && e.data.size) rec.chunks.push(e.data); };
  recorder.onstop = async () => {
    clearTimeout(rec.timer);
    stream.getTracks().forEach((t) => t.stop());
    const chunks = rec.chunks;
    const rid = rec.id;
    rec = null;
    if (!chunks.length) { render(); return; }

    const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
    try {
      await idbPut(rid, blob);
      const r = records.find((x) => x.id === rid);
      if (r) { r.n = 1; saveRecords(); }
    } catch (e) {
      toast('音频保存失败：' + (e.message || e));
    }
    render();
  };

  recorder.start();
  // 上限保护：避免用户忘停导致超大音频
  rec.timer = setTimeout(() => { if (rec && rec.id === id) stopRec(); }, CONFIG.MAX_RECORD_MS);
  render();
}

function stopRec() {
  if (!rec) return;
  try { if (rec.recorder.state !== 'inactive') rec.recorder.stop(); }
  catch (e) { rec = null; render(); }
}

/* ══ 发送 ═════════════════════════════════════════════════════ */
async function postOne(payload) {
  const text = `${CONFIG.TAG} ${JSON.stringify(payload)}`;
  const res = await fetch(CONFIG.WEBHOOK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ msg_type: 'text', content: { text } }),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const j = await res.json().catch(() => ({}));
  // 飞书成功返回 {code:0} 或 {StatusCode:0}，两种都见过
  if (j.code !== 0 && j.StatusCode !== 0) {
    throw new Error(j.msg || j.StatusMessage || `code=${j.code}`);
  }
}

function splitChunks(s, n) {
  const out = [];
  for (let i = 0; i < s.length; i += n) out.push(s.slice(i, i + n));
  return out.length ? out : [''];
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const s = String(fr.result);
      const i = s.indexOf(',');
      resolve(i >= 0 ? s.slice(i + 1) : '');
    };
    fr.onerror = () => reject(fr.error);
    fr.readAsDataURL(blob);
  });
}

/** 首次发送：音频按 CHUNK_SIZE 分片，逐条发（含间隔避开限速） */
async function sendRecord(r) {
  let parts = [''];
  let hasAudio = 0;
  if (r.n) {
    const blob = await idbGet(r.id);
    if (blob) {
      const b64 = await blobToBase64(blob);
      parts = splitChunks(b64, CONFIG.CHUNK_SIZE);
      hasAudio = 1;
    } else {
      // 音频丢了（清过浏览器数据）——照发文字，不阻塞打点
      toast('音频已丢失，将只发送文字');
    }
  }
  for (let i = 0; i < parts.length; i++) {
    await postOne({
      id: r.id, seq: i + 1, total: parts.length,
      t: r.t, u: reporter, c: r.c || '', v: r.v || '',
      a: parts[i], n: hasAudio,
    });
    if (i < parts.length - 1) await sleep(CONFIG.CHUNK_GAP_MS);
  }
}

/**
 * 补发修改：飞书 webhook 只能发不能改，所以「改评论后保存」=
 * 补发一条 e:1 的消息，RTM 侧据此 UPDATE 原记录的 comment / vehicle_plate。
 * 不回传音频（音频不会变，重传只会白白占带宽）。
 */
async function sendEdit(r) {
  await postOne({
    id: r.id, e: 1, seq: 1, total: 1,
    t: r.t, u: reporter, c: r.c || '', v: r.v || '', n: 0,
  });
}

/* ══ 渲染 ═════════════════════════════════════════════════════ */
const ST_TAG = {
  draft:  ['draft',  '待保存'],
  saving: ['',       '发送中'],
  saved:  ['saved',  '已保存'],
  failed: ['failed', '发送失败'],
};

function render() {
  const gen = ++renderGen;   // 作废此前所有未完成的音频异步回调
  $('#who').textContent = reporter || '未设置';
  renderVehLabel();

  const box = $('#list');
  if (curBlobUrl) { URL.revokeObjectURL(curBlobUrl); curBlobUrl = null; }
  box.textContent = '';

  if (!records.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = '还没有打点记录。点下方「打点」开始记录。';
    box.appendChild(d);
    return;
  }

  records.forEach((r) => box.appendChild(buildCard(r, gen)));
}

function buildCard(r, gen) {
  const open = openId === r.id;
  const card = document.createElement('div');
  card.className = 'rec' + (open ? ' open' : '') + (r.st === 'saving' ? ' saving' : '') +
                 (r.st === 'failed' ? ' failed' : '');

  /* ── 卡片头（点击展开/收起）── */
  const head = document.createElement('div');
  head.className = 'rec-head';

  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = hhmmss(r.t);
  head.appendChild(time);

  const tags = document.createElement('span');
  tags.className = 'tags';
  // 车辆是**归属**信息（这条打点属于哪辆车），不是内容标签 ——
  // 收起态也必须可见，否则核对该车打过哪些点要逐条展开
  if (r.v) {
    const v = document.createElement('span');
    v.className = 'tag veh';
    v.textContent = r.v;
    tags.appendChild(v);
  }
  if (r.n) {
    const a = document.createElement('span');
    a.className = 'tag';
    a.textContent = '录音';
    tags.appendChild(a);
  }
  if (r.c) {
    const c = document.createElement('span');
    c.className = 'tag';
    c.textContent = '评论';
    tags.appendChild(c);
  }
  const [cls, label] = ST_TAG[r.st] || ST_TAG.draft;
  const st = document.createElement('span');
  st.className = 'tag ' + cls;
  st.textContent = label;
  tags.appendChild(st);
  head.appendChild(tags);

  const chev = document.createElement('span');
  chev.className = 'chev';
  chev.textContent = '▶';
  head.appendChild(chev);

  head.addEventListener('click', () => {
    if (rec && rec.id !== r.id) stopRec();     // 切换时停掉当前录音
    openId = open ? null : r.id;
    render();
  });
  card.appendChild(head);

  if (!open) return card;

  /* ── 卡片体（展开态）── */
  const body = document.createElement('div');
  body.className = 'rec-body';

  /* 打点时间（可微调，用于「补记刚才发生的事」）*/
  const fTime = document.createElement('div');
  fTime.className = 'field';
  const lbTime = document.createElement('label');
  lbTime.textContent = '打点时间';
  fTime.appendChild(lbTime);
  const tr = document.createElement('div');
  tr.className = 'time-row';
  const tv = document.createElement('span');
  tv.className = 'val';
  tv.textContent = r.t;
  tr.appendChild(tv);
  [['-1', '-1分'], ['+1', '+1分']].forEach(([d, txt]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mini';
    b.textContent = txt;
    b.addEventListener('click', () => {
      const d2 = new Date(r.t.replace(' ', 'T'));
      d2.setMinutes(d2.getMinutes() + Number(d));
      r.t = `${d2.getFullYear()}-${pad(d2.getMonth() + 1)}-${pad(d2.getDate())} ` +
            `${pad(d2.getHours())}:${pad(d2.getMinutes())}:${pad(d2.getSeconds())}`;
      saveRecords();
      render();
    });
    tr.appendChild(b);
  });
  fTime.appendChild(tr);
  body.appendChild(fTime);

  /* 车辆（继承顶部「当前车辆」，多车场景可单独改）*/
  const fVeh = document.createElement('div');
  fVeh.className = 'field';
  const lbVeh = document.createElement('label');
  lbVeh.textContent = '车辆';
  fVeh.appendChild(lbVeh);
  const vr = document.createElement('div');
  vr.className = 'time-row';
  const vv = document.createElement('span');
  vv.className = 'val';
  vv.textContent = r.v || '未选择';
  vr.appendChild(vv);
  const vb = document.createElement('button');
  vb.type = 'button';
  // 带 veh-btn 是为测试可定位：同卡片里时间行还有两个 .mini（±1分），
  // 只靠 .mini 会选到时间微调按钮
  vb.className = 'mini veh-btn';
  vb.textContent = '选择';
  vb.addEventListener('click', () => openVehDialog(r.id));
  vr.appendChild(vb);
  fVeh.appendChild(vr);
  body.appendChild(fVeh);

  /* 录音 */
  const fRec = document.createElement('div');
  fRec.className = 'field';
  const lbRec = document.createElement('label');
  lbRec.textContent = '录音';
  fRec.appendChild(lbRec);

  const rw = document.createElement('div');
  rw.className = 'rec-wrap';
  const isThisRec = rec && rec.id === r.id;
  const rb = document.createElement('button');
  rb.type = 'button';
  rb.className = 'rec-btn' + (isThisRec ? ' on' : '');
  const ico = document.createElement('span');
  ico.className = 'ico';
  ico.textContent = isThisRec ? '■' : '🎤';
  const lbl = document.createElement('span');
  lbl.textContent = isThisRec ? '停止' : (r.n ? '重录' : '录音');
  rb.appendChild(ico);
  rb.appendChild(lbl);
  rb.addEventListener('click', () => {
    if (isThisRec) stopRec();
    else startRec(r.id);
  });
  rw.appendChild(rb);

  const side = document.createElement('div');
  side.className = 'rec-side';
  if (r.n) {
    const hint = document.createElement('div');
    hint.className = 'rec-hint';
    hint.textContent = '加载录音…';
    side.appendChild(hint);
    // 异步取 Blob 生成播放地址
    // ⚠️ 必须先查代次再 createObjectURL：若这期间又发生了一次 render
    //    （如用户快速展开另一条），本回调创建的 URL 已无人引用也无人 revoke，
    //    会永久泄漏（Blob 被 objectURL 钉在内存里）。同理 hint 可能已从 DOM 移除。
    idbGet(r.id).then((blob) => {
      if (gen !== renderGen) return;
      if (!blob) { hint.textContent = '录音已丢失'; hint.classList.add('err'); return; }
      hint.remove();
      const au = document.createElement('audio');
      au.controls = true;
      au.preload = 'metadata';
      curBlobUrl = URL.createObjectURL(blob);
      au.src = curBlobUrl;
      side.appendChild(au);
    }).catch(() => {
      if (gen !== renderGen) return;
      hint.textContent = '录音读取失败';
      hint.classList.add('err');
    });
  } else {
    const hint = document.createElement('div');
    hint.className = 'rec-hint';
    hint.textContent = isThisRec ? '正在录音…再次点击停止' : '点击左侧按钮开始录音';
    side.appendChild(hint);
  }
  rw.appendChild(side);
  fRec.appendChild(rw);
  body.appendChild(fRec);

  /* 文字评论 */
  const fCmt = document.createElement('div');
  fCmt.className = 'field';
  const lbCmt = document.createElement('label');
  lbCmt.textContent = '文字评论';
  fCmt.appendChild(lbCmt);
  const ta = document.createElement('textarea');
  ta.placeholder = '补充说明（可留空）';
  ta.maxLength = 200;
  ta.value = r.c || '';
  ta.addEventListener('input', () => {
    r.c = ta.value;
    cnt.textContent = `${ta.value.length}/200`;
    // 边打边存：手机浏览器随时可能被系统回收，只靠「保存」按钮才落盘
    // 会让用户白打一段字（此处的存是 localStorage，不触发任何发送）
    saveRecords();
  });
  fCmt.appendChild(ta);
  const cnt = document.createElement('div');
  cnt.className = 'counter';
  cnt.textContent = `${(r.c || '').length}/200`;
  fCmt.appendChild(cnt);
  body.appendChild(fCmt);

  /* 操作 */
  const acts = document.createElement('div');
  acts.className = 'actions';

  const save = document.createElement('button');
  save.type = 'button';
  save.className = 'btn primary';
  save.textContent = r.sent ? '保存修改' : '保存';
  save.disabled = r.st === 'saving';
  save.addEventListener('click', () => onSave(r.id, ta.value));

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'btn danger';
  del.textContent = '删除';
  del.addEventListener('click', () => onDelete(r.id));

  acts.appendChild(save);
  acts.appendChild(del);
  body.appendChild(acts);

  card.appendChild(body);
  return card;
}

/* ══ 行为 ═════════════════════════════════════════════════════ */
function onPunch() {
  if (!reporter) { $('#whoMask').classList.add('show'); return; }
  if (rec) stopRec();                       // 有录音在跑，先停
  const r = {
    id: newId(),
    t: nowStamp(),
    c: '',
    v: curVehicle,          // 继承顶部「当前车辆」，展开后仍可单独改
    n: 0,
    st: 'draft',
    sent: false,
  };
  records.unshift(r);
  openId = r.id;
  saveRecords();
  render();
  // 滚到新卡片
  requestAnimationFrame(() => {
    const el = $('#list').firstElementChild;
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
}

async function onSave(id, comment) {
  const r = records.find((x) => x.id === id);
  if (!r) return;
  if (rec && rec.id === id) { toast('请先停止录音'); return; }

  r.c = comment || '';
  // ⚠️ 只看 sent，不能加 `&& r.st === 'saved'`：若改评论时发送失败，
  //    st 变成 failed 而 sent 仍为 true，再点保存会被误判成「首发」，
  //    于是重新上传整段音频、在群里多出一份分片记录。
  const isEdit = r.sent;

  // 已发送过 → 只补发评论；否则整条首发
  r.st = 'saving';
  saveRecords();
  render();

  try {
    if (isEdit) await sendEdit(r);
    else        await sendRecord(r);

    r.st = 'saved';
    r.sent = true;
    openId = null;                          // 保存成功 → 收折
    saveRecords();
    render();
    toast(isEdit ? '修改已保存' : '打点已保存');
  } catch (e) {
    r.st = 'failed';
    saveRecords();
    render();
    toast('保存失败：' + (e.message || e) + '，可再次点击保存重试', 3200);
  }
}

async function onDelete(id) {
  const r = records.find((x) => x.id === id);
  if (!r) return;
  if (r.sent && !confirm('该条已发送到飞书群，删除仅移除本机记录，服务器上仍保留。确认删除？')) return;
  if (rec && rec.id === id) stopRec();
  try { await idbDel(id); } catch { /* 音频不存在也无妨 */ }
  records = records.filter((x) => x.id !== id);
  if (openId === id) openId = null;
  saveRecords();
  render();
}

/* ══ 记录人设置 ═══════════════════════════════════════════════ */
function openWhoDialog() {
  $('#whoInput').value = reporter || '';
  $('#whoMask').classList.add('show');
  setTimeout(() => $('#whoInput').focus(), 60);
}
$('#whoEdit').addEventListener('click', openWhoDialog);

$('#whoSave').addEventListener('click', () => {
  const v = $('#whoInput').value.trim();
  if (!v) { toast('请输入姓名'); return; }
  reporter = v;
  localStorage.setItem(K_REPORTER, v);
  $('#whoMask').classList.remove('show');
  render();
});
$('#whoInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') $('#whoSave').click();
});

/* ══ 车辆选择 ═══════════════════════════════════════════════ */
// 顶部「选择」= 改整场测试的当前车辆；卡片里的「选择」= 只改那一条
$('#vehEdit').addEventListener('click', () => openVehDialog(null));
$('#vehCancel').addEventListener('click', () => {
  $('#vehMask').classList.remove('show');
  vehTarget = null;
});
$('#vehSearch').addEventListener('input', (e) => renderVehList(e.target.value));

$('#punch').addEventListener('click', onPunch);

/* ══ 启动 ═════════════════════════════════════════════════════ */
// ⚠️ 先判后改：若上一轮「发送中」被中断（关页面/崩溃），这些记录会永久卡在
//    saving —— 而 saving 态下卡片带 pointer-events:none，用户既不能重试也不能
//    删除，成为幽灵条目。降级为 failed 让它可操作。
//    （不能写成「先 forEach 改完再 some 判断」，那时已经没有 saving 了，判断恒假，
//     修正结果永远存不回 localStorage。）
const stuck = records.some((r) => r.st === 'saving');
if (stuck) {
  records.forEach((r) => { if (r.st === 'saving') r.st = 'failed'; });
  saveRecords();
}

render();
// 车辆清单异步拉取：不阻塞首屏（内置兜底副本已可用），到了再刷新顶部标签
void loadVehicles();

if (!reporter) {
  $('#whoMask').classList.add('show');
  setTimeout(() => $('#whoInput').focus(), 200);
}

// 离开页面前提醒未保存的草稿
window.addEventListener('beforeunload', (e) => {
  if (records.some((r) => r.st === 'draft' || r.st === 'failed')) {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
</body>
</html>
